
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-box">
        <form id="login-form" action="home.html">
            <input type="checkbox" class="input-check" id="input-check">
            <!-- <label for="input-check" class="toggle">
                <span class="text off">off</span>
                <span class="text on">on</span>
            </label> -->
            <div class="light"></div>

            <h2>Login</h2>
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="mail"></ion-icon>
                </span>
                <input type="email" id="email" required>
                <label>Email</label>
                <div class="input-line"></div>
            </div>
            <div class="input-box">
                <input type="password" id="password" required>
                <label>Password</label>
                <div class="input-line"></div>
            </div>
            <div class="remember-forgot">
                <input type="checkbox" id="remember-me"> Remember Me
            </div>
            <button type="submit" id="login-btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Register</a></p>
            </div>
        </form>
    </div>

    <script>
        // Hardcoded correct password (for demo purposes)
        const correctPassword = "123456"; // This would come from a server in a real application

        // Function to retrieve stored user data from localStorage
        function getStoredUser() {
            const user = JSON.parse(localStorage.getItem("user"));
            return user ? user : null;
        }

        // Function to store user data in localStorage
        function storeUser(email, password) {
            const user = { email: email, password: password };
            localStorage.setItem("user", JSON.stringify(user));
        }

        // Function to remove user data from localStorage
        function removeStoredUser() {
            localStorage.removeItem("user");
        }

        window.onload = function() {
            const storedUser = getStoredUser();
            if (storedUser) {
                document.getElementById("email").value = storedUser.email;
                document.getElementById("password").value = storedUser.password;
                document.getElementById("remember-me").checked = true;
            }
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (email === '' || password === '') {
                alert('Please fill in all fields');
                return;
            }

            // Check if the entered password matches the hardcoded correct password
            if (password !== correctPassword) {
                alert('Wrong password. Please try again.');
                return; // Stop further action if password is wrong
            }

            if (rememberMe) {
                storeUser(email, password); // Store both email and password
            } else {
                removeStoredUser();  // Remove stored user data if "Remember Me" is unchecked
            }

            // Simulate login and redirect (since password is correct)
            alert('Login successful!');
            window.location.href = 'home.html';
        });
    </script>
</body>

</html>
